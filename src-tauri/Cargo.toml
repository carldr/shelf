[package]
name = "shelf"
version = "0.1.0"
description = "A menu bar shelf of your saved Spotify albums"
edition = "2021"
license = "MIT"

[lib]
name = "shelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# image decodes JPEGs about 30 times slower without optimisation.
[profile.dev.package."*"]
opt-level = 3
